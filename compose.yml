services:
  dev:
    image: aldimh/docker-playwright-demo:1.0.0
    working_dir: /workspace

    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules

    ports:
      - "127.0.0.1:9323:9323"

    ipc: host
    init: true
    stdin_open: true
    tty: true
    command: bash

volumes:
  node_modules: